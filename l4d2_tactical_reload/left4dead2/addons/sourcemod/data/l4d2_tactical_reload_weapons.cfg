// l4d2_tactical_reload —— 武器开关配置（KeyValues 格式）
//
// enabled          1=该武器启用本插件（战术换弹 +1 / 换弹拦截 与模式 2 的定时回填 / 余弹回收）；0=完全不管。
//                  所有武器都必须显式配置，未出现在本文件里的武器一律不生效（代码中没有写死任何武器）。
// bonus            可选。1=该武器参与「战术换弹 +1」与「膛内留一发」（默认）；
//                  0=该武器**不给 +1、也不做膛内留一发**，只保留引擎原生装填与模式 2 的
//                  定时回填 / 余弹回收（此时定时回填的目标值就是基础满弹匣）。
//                  典型用法：把某把枪当纯 csgo 换弹用（如 UZI / MAC-10）。
// clip_size        可选。正值设置真实武器脚本弹容，拾取/空匣/战术换弹统一使用；缺键或0跟随服务器。
//                  单持与双持共用基础弹容；基础条目正值优先，否则采用双持条目正值。
// infinite_reserve 可选。1=该武器后备弹药无限（奖励不扣后备）；0=正常扣减；
//                  省略时自动判断（手枪类默认视为后备弹药无限）。
// shell_fed        可选。1=该武器逐发装填（每次装一发、不清零弹匣，如霰弹枪）；0=弹匣式；
//                  省略时自动判断（L4D2 武器类型为霰弹枪的视为逐发装填）。
//                  它决定是否适用「膛内留一发」；霰弹枪不适用。已到额外上限时，弹匣式与逐发装填一律拦截。
// reload_time      可选。csgo 观感（l4d2_tactical_reload_mode 2）下，该武器按 R 之后
//                  第几秒把弹匣回填到「满弹匣 + 1」（秒，0 = 该武器不启用定时回填）。
//                  霰弹枪保持 0：逐发装填与固定秒数回填会打架，霰弹枪继续走「抬高弹容」那条路。
//                  缺这个键的条目按 0 处理，并在日志里列一次，便于发现漏配。
//
// 双持手枪是两把独立手枪，使用独立的 "<武器名>_dual" 条目控制，两把各自 +1。
// 例如这里的 weapon_pistol_dual 控制「双持手枪」，weapon_pistol 控制「单持手枪」。

