// 插件总开关
sm_csgoladder_enabled "1"

// 生还者是否启用
sm_csgoladder_survivors "1"

// 特感是否启用（不包括幽灵特感）
sm_csgoladder_infected "0"

// 修改梯子上移动速度
sm_csgoladder_speed "200"

// csgo梯子移动速度比例
sm_csgoladder_csgo_scale "0.78"

// shift 和蹲下时移动速度
sm_csgoladder_csgo_duck_speed "68"

// debug功能
sm_csgoladder_debug "0"
