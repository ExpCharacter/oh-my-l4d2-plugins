// 插件总开关
l4d2_csgoladder_enabled "1"

// 生还者是否启用
l4d2_csgoladder_survivors "1"

// 特感是否启用（不包括幽灵特感）
l4d2_csgoladder_infected "0"

// 修改梯子上移动速度
l4d2_csgoladder_speed "200"

// csgo梯子移动速度比例
l4d2_csgoladder_scale "0.78"

// shift 和蹲下时移动速度
l4d2_csgoladder_duck_speed "68"

// debug功能
l4d2_csgoladder_debug "0"
